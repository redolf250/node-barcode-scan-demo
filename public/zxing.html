<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barcode Scanner - ZXing (Continuous Mode)</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ZXing (pinned — @latest can shift under you and introduce regressions) -->
  <script src="https://unpkg.com/@zxing/library@0.20.0"></script>

  <style>
    body {
      background: #f4f6f9;
    }

    #scanner-wrapper {
      position: relative;
      width: 100%;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    #scanner {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .idle { background: gray; }
    .running { background: #28a745; }
    .scanned { background: #007bff; }

    #scanBox {
      position: absolute;
      top: 20%;
      left: 10%;
      width: 80%;
      height: 60%;
      border: 2px dashed #00ffcc;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="container py-4">

  <h3 class="fw-bold mb-1">🛒 POS Barcode / QR Scanner</h3>
  <p class="text-muted">ZXing-powered continuous scanning with cooldown (no restart needed)</p>

  <!-- Scanner Card -->
  <div class="card shadow-sm border-0 mb-3">
    <div class="card-body">

      <!-- Status -->
      <div class="mb-2">
        <span id="statusDot" class="status-dot idle"></span>
        <span id="statusText">Idle</span>
      </div>

      <!-- Scanner -->
      <div id="scanner-wrapper">
        <video id="scanner" muted playsinline></video>
        <div id="scanBox"></div>
      </div>

      <!-- Controls -->
      <div class="d-flex gap-2 mt-3">
        <button id="startBtn" class="btn btn-success" onclick="startScanner()">▶ Start</button>
        <button class="btn btn-danger" onclick="stopScanner()">⛔ Stop</button>
      </div>

    </div>
  </div>

  <!-- Result -->
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h6 class="fw-bold">Last Scanned</h6>
      <div id="result" class="text-muted">No scan yet</div>
    </div>
  </div>

</div>

<script>
  let isRunning = false;
  let isStarting = false; // guards against a double-start calling video.play() twice
  let locked = false;
  let lastCode = null;
  let selectedDeviceId = null;

  const cooldownTime = 2000; // 2 seconds cooldown

  // Formats: retail barcodes + QR codes
  const { BrowserMultiFormatReader, DecodeHintType, BarcodeFormat } = ZXing;

  const hints = new Map();
  hints.set(DecodeHintType.POSSIBLE_FORMATS, [
    BarcodeFormat.EAN_13,      // EAN-13 (most retail products)
    BarcodeFormat.EAN_8,       // Small retail products
    BarcodeFormat.UPC_A,       // US products
    BarcodeFormat.UPC_E,
    BarcodeFormat.CODE_128,    // Internal inventory labels
    BarcodeFormat.CODE_39,     // Warehouse labels
    BarcodeFormat.QR_CODE      // QR codes
  ]);
  hints.set(DecodeHintType.TRY_HARDER, true);

  const codeReader = new BrowserMultiFormatReader(hints);

  function setStatus(type, text) {
    const dot = document.getElementById("statusDot");
    const label = document.getElementById("statusText");
    dot.className = "status-dot " + type;
    label.innerText = text;
  }

  async function pickBackCamera() {
    try {
      const devices = await codeReader.listVideoInputDevices();
      const backCam = devices.find(d => /back|rear|environment/i.test(d.label));
      return backCam ? backCam.deviceId : (devices[0] ? devices[0].deviceId : undefined);
    } catch (err) {
      console.error("Camera enumeration failed:", err);
      return undefined;
    }
  }

  async function startScanner() {
    if (isRunning || isStarting) return;
    isStarting = true;
    document.getElementById("startBtn").disabled = true;

    locked = false;
    lastCode = null;

    selectedDeviceId = await pickBackCamera();

    const constraints = {
      video: {
        deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
        facingMode: selectedDeviceId ? undefined : "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 },
        advanced: [{ focusMode: "continuous" }]
      }
    };

    try {
      await codeReader.decodeFromConstraints(
        constraints,
        "scanner",
        (result, err) => {
          if (result) {
            handleDetection(result.getText());
          }
          // ignore per-frame NotFoundException noise
        }
      );

      isRunning = true;
      setStatus("running", "Scanning...");
      console.log("Scanner started");
    } catch (err) {
      console.error("Failed to start scanner:", err);
      setStatus("idle", "Camera error");
    } finally {
      isStarting = false;
      document.getElementById("startBtn").disabled = false;
    }
  }

  function handleDetection(code) {
    if (locked) return;

    // prevent same code spam
    if (code === lastCode) return;
    lastCode = code;

    locked = true;

    console.log("📦 Code detected:", code);

    document.getElementById("result").innerHTML =
      `<span class="fw-bold text-success">${code}</span>`;

    setStatus("scanned", "Scanned");

    //fetchProduct(code);
    //onBarcodeScan(code);

    // cooldown instead of stopping camera
    setTimeout(() => {
      locked = false;
      document.getElementById("result").innerHTML = "";
      if (isRunning) setStatus("running", "Scanning...");
    }, cooldownTime);
  }

  function stopScanner() {
    if (!isRunning) return;

    codeReader.reset();
    isRunning = false;
    locked = false;

    setStatus("idle", "Idle");

    console.log("Scanner stopped");
  }

  async function onBarcodeScan(barcodeValue) {
    // Get location first
    const position = await new Promise((resolve, reject) =>
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,  // Use GPS, not WiFi
        timeout: 5000
      })
    );
    // Send to backend
    const response = await fetch('/api/scan', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        barcode: barcodeValue,
        userLat: position.coords.latitude,
        userLng: position.coords.longitude,
        shopId: "shop-123"  // Generate a unique ID for this scan session
      })
    });

    const data = await response.json();

    if (data.name || data.price || data.barcode) {
      playBeep();
    }
  }

  async function fetchProduct(barcode) {
    try {
      const res = await fetch(`/api/product/${barcode}`);

      if (!res.ok) throw new Error("Not Found");

      const data = await res.json();
      if (data.name || data.price || data.barcode) {
        playBeep();
      }

      console.log("Product data:", data);

    } catch (err) {
      console.log("Product fetch failed:", err);
    }
  }

  // Audio Feedback
  function playBeep() {
    const audioCtx = new (globalThis.AudioContext || globalThis.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = 600;
    osc.start();
    setTimeout(() => osc.stop(), 150);
  }
</script>

</body>
</html>
